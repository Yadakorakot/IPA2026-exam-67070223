---
- name: Configure Cisco Loopback Interface
  hosts: routers
  gather_facts: false
  connection: ansible.netcommon.network_cli

  vars:
    ansible_network_os: cisco.ios.ios
    ansible_user: "{{ lookup('env', 'ROUTER_USER') }}"
    ansible_password: "{{ lookup('env', 'ROUTER_PASS') }}"
    ansible_ssh_common_args: "-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null"

  tasks:
    - name: Apply desired Loopback configuration
      cisco.ios.ios_config:
        parents:
          - "interface {{ interface_name }}"
        lines:
          - "description {{ description }}"
          - "ip address {{ ipv4_address }} {{ netmask }}"
          - "{{ 'shutdown' if shutdown else 'no shutdown' }}"